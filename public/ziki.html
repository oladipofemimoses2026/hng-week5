  .title {

    grid-row: 2;
    font-weight: 600;
    min-width: 0;
    overflow-wrap: anywhere;

  .meta {
    grid-column: 1 / -1;
    grid-row: 3;
    display: flex;
    flex-wrap: wrap;
    color: var(--muted);

  .meta > span:not(:last-child)::after {

    margin: 0 6px;
    color: var(--muted);
    font-weight: 400;

    color: var(--muted);

      grid-row: auto;
    }
    .chip { justify-self: start; }
    .meta { display: contents; }
    .meta > span::after { content: none !important; }
    .comments, .when { color: var(--muted); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }

    if (n === 1) return "1 stuck";
    return n + " stuck";
  }

  function issueWord(n) {
    return n === 1 ? "issue" : "issues";
  }

  function announce(text) {
    var live = document.getElementById("live");
    live.textContent = "";
    void live.offsetWidth;
    live.textContent = text;
  }

  function updateChrome() {
    document.getElementById("view-before").setAttribute("aria-pressed", view === "before" ? "true" : "false");
    document.getElementById("view-after").setAttribute("aria-pressed", view === "after" ? "true" : "false");
    document.querySelectorAll("[data-area]").forEach(function (btn) {
      btn.setAttribute("aria-pressed", btn.dataset.area === area ? "true" : "false");
    });
  }

  function captureFolds() {
    document.querySelectorAll("details[data-fold]").forEach(function (d) {
      folds[d.dataset.fold] = d.open;
    });
  }

  function rulesHtml() {
    return (
      '<section class="rules" aria-labelledby="rules-h">' +
        '<h2 id="rules-h">Who decides what</h2>' +
        '<ul>' +
          '<li><span class="k">Agents do alone:</span> fixing, testing and closing ordinary issues.</li>' +
          '<li><span class="k">Always waits for you:</span> putting changes on the live site, anything about money, anything about users\' data.</li>' +
          '<li><span class="k">If you don\'t answer:</span> nothing goes live. It waits for you.</li>' +
        '</ul>' +
      '</section>'
    );
  }

  function lineHtml(text) {
    var i = text.indexOf(" ");
    var who = text.slice(0, i);
    var rest = text.slice(i + 1);
    return '<li><span class="who">' + esc(who) + '</span> ' + esc(rest) + '</li>';
  }

  function foldHtml(id, title, items, asLine) {
    var open = folds[id] ? " open" : "";
    var body = items.map(asLine ? lineHtml : function (t) { return "<li>" + esc(t) + "</li>"; }).join("");
    return (
      '<details class="fold" data-fold="' + id + '"' + open + '>' +
        '<summary><span>' + esc(title) + '</span><span class="fold-end"><span class="fold-count">' + items.length + '</span><span class="chev" aria-hidden="true"></span></span></summary>' +
        '<ul>' + body + '</ul>' +
      '</details>'
    );
  }

  function renderAfter() {
    var closed = morning.done.length;
    var need = morning.needs.length;
    var hello = need === 0
      ? '<h1 class="hello clear" id="allclear" tabindex="-1">All clear. Your agents keep going. Next briefing tomorrow at 8:00.</h1>'
      : '<h1 class="hello" id="greeting">Good morning. Your agents closed ' + closed + ' ' + issueWord(closed) + ' overnight. <span class="accent">' + thingsPhrase(need) + '</span></h1>';
    var stuckClass = morning.stuck > 0 ? "warn-t" : "";
    var strip =
      '<p class="strip" aria-label="' + closed + ' closed, ' + morning.inReview + ' in review, ' + stuckPhrase(morning.stuck) + '">' +
        '<span class="ok-t">' + closed + ' closed</span>' +
        '<span class="middot" aria-hidden="true">·</span>' +
        '<span>' + morning.inReview + ' in review</span>' +
        '<span class="middot" aria-hidden="true">·</span>' +
        '<span class="' + stuckClass + '">' + stuckPhrase(morning.stuck) + '</span>' +
      '</p>';
    var needs = "";
    if (need > 0) {
      needs = '<section class="needs" aria-labelledby="needs-h"><h2 id="needs-h">Needs you</h2>' +
        morning.needs.map(cardHtml).join("") +
      '</section>';
    }
    return hello + strip + needs +
      foldHtml("wait", "Can wait", morning.canWait, false) +
      foldHtml("done", "Done overnight", morning.done, true) +
      rulesHtml();
  }

  function cardHtml(id) {
    var first = morning.needs[0] === id;
    if (id === "checkout") {
      var expanded = morning.expanded;
      return (
        '<article class="card" id="card-checkout" aria-labelledby="ask-checkout">' +
          '<h3 id="ask-checkout">Orbit wants to put the checkout fix on the live site.</h3>' +
          '<p class="note">Changes to the live product always wait for you.</p>' +
          '<div class="actions with-link">' +
            '<button type="button" class="btn primary" id="' + (first ? "next-action" : "approve-checkout") + '" data-action="approve">Approve</button>' +
            '<button type="button" class="btn ghost" id="expand-checkout" data-action="expand" aria-expanded="' + (expanded ? "true" : "false") + '" aria-controls="checkout-change">' +
              (expanded ? "Hide what changed" : "See what changed") +
            '</button>' +
          '</div>' +
          '<div class="change" id="checkout-change"' + (expanded ? "" : " hidden") + '>' +
            '<p>The card form was wiping the address whenever a payment failed.</p>' +
            '<p>Orbit fixed it, and the tests passed on a copy of the live site.</p>' +
          '</div>' +
        '</article>'
      );
    }
    if (id === "pricing") {
      return (
        '<article class="card" id="card-pricing" aria-labelledby="ask-pricing">' +
          '<h3 id="ask-pricing">Juno asks: should trial users see the new pricing page?</h3>' +
          '<p class="note">Trial users still see the old prices.</p>' +
          '<div class="actions">' +
            '<button type="button" class="btn secondary" id="' + (first ? "next-action" : "yes-pricing") + '" data-action="yes">Yes, show it</button>' +
            '<button type="button" class="btn secondary" data-action="no">Not yet</button>' +
          '</div>' +
        '</article>'
      );
    }
    return (
      '<article class="card" id="card-server" aria-labelledby="ask-server">' +
        '<h3 id="ask-server">Pebble is stuck: the test server isn\'t responding.</h3>' +
        '<p class="note">Tests are waiting until it answers.</p>' +
        '<div class="actions">' +
          '<button type="button" class="btn primary" id="' + (first ? "next-action" : "restart-server") + '" data-action="restart">Restart it</button>' +
          '<button type="button" class="btn secondary" data-action="later">I\'ll look later</button>' +
        '</div>' +
      '</article>'
    );
  }

  function visibleIssues(data) {
    var all = data.issues.slice().sort(function (a, b) { return b.id - a.id; });
    if (filter === "all") return all;
    return all.filter(function (item) { return item.status === filter; });
  }

  function renderBefore() {
    var data = AREAS[area];
    var rows = visibleIssues(data);
    var filters = [
      ["open", "Open", data.counts.open],
      ["progress", "In progress", data.counts.progress],
      ["done", "Done", data.counts.done],
      ["all", "All", data.counts.all]
    ];
    var filterHtml = '<div class="filters" role="group" aria-label="Filter issues">';
    filters.forEach(function (item, index) {
      if (index > 0) filterHtml += '<span class="middot" aria-hidden="true">·</span>';
      var pressed = filter === item[0] ? "true" : "false";
      filterHtml += '<button type="button" class="filter" data-action="filter" data-filter="' + item[0] + '" aria-pressed="' + pressed + '">' +
        item[1] + ' <span class="fcount">' + item[2] + '</span></button>';
    });
    filterHtml += "</div>";
    var list = rows.map(function (item) {
      var chip = item.status === "open" ? "chip" : "chip " + item.status;
      return (
        '<li class="row">' +
          '<span class="num">#' + item.id + '</span>' +
          '<span class="title">' + esc(item.title) + '</span>' +
          '<span class="' + chip + '">' + statusLabel(item.status) + '</span>' +
          '<span class="meta">' +
            '<span class="person">' + esc(item.person) + '</span>' +
            '<span class="comments">' + commentLabel(item.comments) + '</span>' +
            '<span class="when">' + esc(item.time) + '</span>' +
          '</span>' +
        '</li>'
      );
    }).join("");
    var total = filter === "all" ? data.counts.all : data.counts[filter];
    var more = total - rows.length;
    var moreHtml = "";
    if (more > 0) {
      var noun = more === 1 ? "issue" : "issues";
      var mid = filter === "open" ? " open" : filter === "done" ? " done" : filter === "progress" ? " in progress" : "";
      moreHtml = '<li class="more">' + more + " more" + mid + " " + noun + "</li>";
    }
    return (
      '<h1 class="page-title">Issues</h1>' +
      filterHtml +
      '<div class="list"><ul class="issues" id="issue-list">' + list + moreHtml + '</ul></div>'
    );
  }

  function render(opts) {
    opts = opts || {};
    captureFolds();
    var y = opts.scrollTop ? 0 : window.scrollY;
    document.getElementById("screen").innerHTML = view === "after" ? renderAfter() : renderBefore();
    window.scrollTo(0, y);
    if (opts.focus) {
      var el = document.getElementById(opts.focus);
      if (el) el.focus();
    }
  }

  function removeNeed(id) {
    morning.needs = morning.needs.filter(function (item) { return item !== id; });
  }

  function finish(message, line) {
    if (line) morning.done.unshift(line);
    var left = morning.needs.length;
    announce(message + " " + stillPhrase(left));
    render({ focus: left === 0 ? "allclear" : "next-action" });
  }

  document.addEventListener("click", function (event) {
    var btn = event.target.closest("button");
    if (!btn || !btn.dataset.action) return;
    var action = btn.dataset.action;
    if (action === "view") {
      view = btn.dataset.view;
      updateChrome();
      render({ scrollTop: true });
      return;
    }
    if (action === "area") {
      area = btn.dataset.area;
      updateChrome();
      if (view === "before") render({ scrollTop: true });
      return;
    }
    if (action === "filter") {
      filter = btn.dataset.filter;
      render({ scrollTop: true });
      return;
    }
    if (action === "expand") {
      morning.expanded = !morning.expanded;
      announce(morning.expanded
        ? "Showing what changed on the checkout fix."
        : "Hid the change summary.");
      render({ focus: "expand-checkout" });
      return;
    }
    if (action === "approve") {
      removeNeed("checkout");
      finish("Approved. The checkout fix can go on the live site.", "You approved the checkout fix for the live site.");
      return;
    }
    if (action === "yes") {
      removeNeed("pricing");
      morning.inReview = Math.max(0, morning.inReview - 1);
      finish("Trial users will see the new pricing page.", "You said trial users should see the new pricing page.");
      return;
    }
    if (action === "no") {
      removeNeed("pricing");
      morning.inReview = Math.max(0, morning.inReview - 1);
      finish("Trial users will keep the current pricing page.", "You said not yet for the new pricing page.");
      return;
    }
    if (action === "restart") {
      removeNeed("server");
      morning.stuck = 0;
      finish("Restarting the test server. Pebble can go on.", "You restarted the test server so Pebble can continue.");
      return;
    }
    if (action === "later") {
      removeNeed("server");
      morning.canWait.unshift("The test server still is not responding.");
      finish("Saved for later, in Can wait.", null);
    }
  });

  updateChrome();
  render({ scrollTop: true });
})();
</script>
</body>
</html>
