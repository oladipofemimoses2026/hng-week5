<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2d2470">
<title>Zedu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1d1c2b;background:#fff;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid #9d90ff;outline-offset:2px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;color:#9c99b6;flex:none;transition:background .15s,color .15s}
.ic:hover{background:rgba(75,63,174,.08);color:#4b3fae}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{display:grid;height:100vh;height:100dvh;grid-template-columns:72px 260px minmax(0,1fr);grid-template-rows:60px minmax(0,1fr)}

/* top bar */
.top{grid-column:1/-1;display:grid;grid-template-columns:1fr minmax(0,560px) 1fr;align-items:center;background:#2d2470;padding:0 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.ws{display:flex;align-items:center;gap:6px;height:44px;padding:0 8px;border-radius:10px;color:#cfcaf5;justify-self:start}
.ws:hover{background:rgba(255,255,255,.1)}
.wsq{width:30px;height:30px;border-radius:8px;background:#ff5fa2;display:grid;place-items:center}
.sf{position:relative}
.sf input{width:100%;height:44px;border:0;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;padding:0 76px 0 42px;-webkit-appearance:none;appearance:none}
.sf input::placeholder{color:rgba(255,255,255,.7)}
.sf input:focus{background:rgba(255,255,255,.2)}
.sf>.i{position:absolute;left:14px;top:12px;color:rgba(255,255,255,.7);pointer-events:none}
.sf kbd{position:absolute;right:12px;top:11px;font:600 11px Inter,sans-serif;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.14);color:rgba(255,255,255,.75);pointer-events:none}

/* rail */
.rail{background:#2d2470;display:flex;flex-direction:column;align-items:center;padding:8px 0 10px;gap:6px}
.rb{display:flex;flex-direction:column;align-items:center;gap:3px;width:64px;color:#bdb7ee;font-size:11px;font-weight:500;padding:2px 0}
.rb .b{width:44px;height:40px;display:grid;place-items:center;border-radius:12px;transition:background .15s}
.rb .b .i{width:22px;height:22px}
.rb:hover .b{background:rgba(255,255,255,.08)}
.rb.on{color:#fff}.rb.on .b{background:rgba(255,255,255,.18)}
.sp{flex:1}
.rail .ic{color:#bdb7ee}.rail .ic:hover{background:rgba(255,255,255,.1);color:#fff}
.me{width:34px;height:34px;border-radius:9px;background:#ff8a5c;color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}

/* sidebar */
.side{background:#4b3fae;color:rgba(255,255,255,.82);padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.sr{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;text-align:left;width:100%;font-weight:500;color:inherit;transition:background .15s}
.sr:hover{background:rgba(255,255,255,.1)}
.sr.on{background:rgba(255,255,255,.2);color:#fff;font-weight:700}
.sr .hs{width:20px;text-align:center;opacity:.7;font-size:17px}
.bd{margin-left:auto;background:#f0509a;color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.gh{margin-top:12px;font-size:13px;font-weight:600;opacity:.9}
.gh .i{width:16px;height:16px}

/* main */
main{display:flex;flex-direction:column;min-width:0;min-height:0;background:#fff}
.hd{padding:0 24px}
.ht{display:flex;align-items:center;justify-content:space-between;height:56px}
.ht h1{font-size:18px;font-weight:800;display:flex;gap:6px;align-items:center}
.ht h1 span{color:#8e8ba8;font-weight:500}
.hr{display:flex;align-items:center;gap:14px}
.bz{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border:1px solid #d9d5f3;border-radius:999px;font-weight:600;font-size:14px;color:#3b3290;transition:background .15s}
.bz:hover{background:#f4f2ff}
.st{display:flex;align-items:center}
.st i{font-style:normal;width:28px;height:28px;border-radius:8px;border:2px solid #fff;margin-left:-8px;display:grid;place-items:center;color:#fff;font:700 11px Inter,sans-serif}
.st i:first-child{margin-left:0}
.st .mo{background:#ece9ff;color:#4b3fae;width:auto;padding:0 8px;border-radius:999px}
.tabs{display:flex;gap:6px;border-bottom:1px solid #e7e5f3;margin:0 -24px;padding:0 24px}
.tab{min-height:44px;padding:0 12px;font-weight:600;color:#6c698a;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:#3b3290}
.tab[aria-selected=true]{color:#4b3fae;border-color:#4b3fae}

.th{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:12px 24px;scrollbar-width:thin}
.th>:first-child{margin-top:auto}
.dw{position:relative;text-align:center;margin:4px 0 8px}
.dw:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid #e7e5f3}
.dw span{position:relative;background:#fff;border:1px solid #e0ddf2;border-radius:999px;padding:4px 14px;font-size:12px;font-weight:600;color:#5d5a78}
.msg{display:flex;gap:12px;padding:8px 12px;margin:0 -12px;border-radius:10px}
.msg:hover{background:#f8f7fd}
.av{width:40px;height:40px;border-radius:9px;flex:none;color:#fff;font-weight:700;display:grid;place-items:center}
.mb{min-width:0}
.mh{display:flex;align-items:center;gap:8px;line-height:1.3}
.mh b{font-weight:700}
.mh time{font-size:12px;color:#8e8ba8}
.mb p{overflow-wrap:anywhere}
.tk{position:relative;display:inline-block;width:26px;height:14px}
.ck{position:absolute;inset:0;display:grid;place-items:center;font:700 12px/1 system-ui,sans-serif;letter-spacing:-2px;color:#1f9d73;opacity:0}

/* composer */
.cw{padding:0 24px 20px}
.hint{height:28px;display:flex;align-items:center;font-size:12px;color:#8e8ba8;padding:0 4px;transition:opacity .35s}
.hint.gone{opacity:0}
.comp{border:1px solid #6f61e8;border-radius:14px;background:#fff;transition:box-shadow .15s}
.comp:focus-within{box-shadow:0 0 0 3px rgba(111,97,232,.16)}
.tb,.tl{display:flex}
.tb{padding:2px 6px 0;overflow-x:auto;scrollbar-width:none}
.tb .ic{width:44px;height:40px}
.tb .i{width:18px;height:18px}
.in{display:block;width:100%;height:48px;border:0;outline:0;background:none;padding:0 16px}
.bt{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 6px}
.send{width:44px;height:44px;border-radius:12px;background:#4b3fae;color:#fff;display:grid;place-items:center;transition:background .15s,opacity .15s}
.send:hover{background:#5a4cc6}
.send .i{stroke-width:2.2;transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.send:hover .i,.send:focus-visible .i{transform:rotate(-16deg)}
.send[aria-disabled=true]{opacity:.4;cursor:not-allowed}

/* flying things */
.fly,.card{position:fixed;left:0;top:0;pointer-events:none;z-index:50}
.fly{left:-20px;top:-15px;width:40px;height:30px;will-change:transform,opacity}
.fly svg{width:100%;height:100%;display:block}
.card{z-index:49;background:#fff;border:1px solid #cfc9f7;border-radius:10px;padding:8px 14px;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 18px rgba(45,36,112,.18);will-change:transform,opacity}

.mbar{display:none;align-items:center;gap:4px;background:#2d2470;color:#fff;padding:0 6px}
.mbar b{font-weight:800;font-size:16px}
.mbar .ic{color:#fff}.mbar .ic:hover{background:rgba(255,255,255,.1);color:#fff}

@media(max-width:699px){
.app{grid-template-columns:minmax(0,1fr);grid-template-rows:52px minmax(0,1fr)}
.top,.rail,.side,.ht{display:none}
.mbar{display:flex}
.hd{padding:0 16px}.tabs{margin:0 -16px;padding:0 16px}
.th{padding:12px 16px}
.cw{padding:0 12px calc(12px + env(safe-area-inset-bottom))}
.opt{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="z" viewBox="0 0 24 24"><path d="M6 6h12L6 18h12"/></symbol>

<symbol id="link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></symbol>

<symbol id="ul" viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10"/><circle cx="5" cy="6" r=".8"/><circle cx="5" cy="12" r=".8"/><circle cx="5" cy="18" r=".8"/></symbol>

<symbol id="emo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14c1 1.5 2.2 2.2 3.5 2.2s2.5-.7 3.5-2.2M9 9.5v.5M15 9.5v.5"/></symbol>
<symbol id="gif" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3"/><text x="12" y="14.6" text-anchor="middle" font-size="7" font-weight="700" fill="currentColor" stroke="none" font-family="Inter,sans-serif">GIF</text></symbol>

<symbol id="hp" viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0116 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></symbol>

<div class="app">
  <header class="top">
    <button class="ws" aria-label="Workspace menu"><span class="wsq"><svg class="i" style="width:16px;height:16px;color:#fff;stroke-width:2.6"><use href="#z"/></svg></span><svg class="i" style="width:16px;height:16px"><use href="#chev"/></svg></button>
    <div class="sf"><svg class="i"><use href="#search"/></svg><input type="search" placeholder="Search messages and people…" aria-label="Search messages and people"><kbd>Ctrl K</kbd></div>
    <span></span>
  </header>

  <div class="mbar">
    <button class="ic" aria-label="Open menu"><svg class="i"><use href="#menu"/></svg></button>
    <b># launch-day</b>
    <button class="ic" style="margin-left:auto" aria-label="Start Buzz"><svg class="i"><use href="#hp"/></svg></button>
  </div>

  <nav class="rail" aria-label="Primary">
    <button class="rb on" aria-current="page"><span class="b"><svg class="i"><use href="#home"/></svg></span>Home</button>
    <button class="rb"><span class="b"><svg class="i"><use href="#dm"/></svg></span>DMs</button>
    <button class="rb"><span class="b"><svg class="i"><use href="#people"/></svg></span>People</button>
    <button class="rb"><span class="b"><svg class="i"><use href="#files"/></svg></span>Files</button>
    <button class="rb"><span class="b"><svg class="i"><use href="#bolt"/></svg></span>Buzz</button>
    <span class="sp"></span>
    <button class="ic" aria-label="Notifications"><svg class="i"><use href="#bell"/></svg></button>
    <button class="ic" aria-label="Settings"><svg class="i"><use href="#gear"/></svg></button>
    <button class="ic" aria-label="Your profile"><span class="me">Y</span></button>
  </nav>

  <nav class="side" aria-label="Channels">
    <button class="sr"><svg class="i"><use href="#thr"/></svg>Threads<span class="bd">3</span></button>
    <button class="sr"><svg class="i"><use href="#bolt"/></svg>Buzzes</button>
    <button class="sr gh"><svg class="i"><use href="#chev"/></svg>Channels</button>
    <button class="sr"><span class="hs">#</span>general</button>
    <button class="sr"><span class="hs">#</span>design</button>
    <button class="sr on" aria-current="page"><span class="hs">#</span>launch-day</button>
    <button class="sr"><span class="hs">#</span>random</button>
    <button class="sr"><span class="hs">#</span>team-updates</button>
  </nav>

  <main>
    <div class="hd">
      <div class="ht">
        <h1><span>#</span>launch-day</h1>
        <div class="hr">
          <button class="bz"><svg class="i"><use href="#hp"/></svg>Start Buzz</button>
          <div class="st" aria-label="24 more members"><i style="background:#e0457b">A</i><i style="background:#2f9e8f">T</i><i style="background:#e8a23a">K</i><i class="mo">+24</i></div>
        </div>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="true">Messages</button>
        <button class="tab" role="tab" aria-selected="false">Pinned</button>
      </div>
    </div>

    <div class="th" id="th" tabindex="0" aria-label="Messages in launch-day">
      <div class="dw"><span>Today</span></div>
      <div class="msg"><div class="av" style="background:#e0457b" aria-hidden="true">A</div><div class="mb"><div class="mh"><b>Ada</b><time data-ago="6"></time></div><p>Ready for the launch?</p></div></div>
      <div class="msg"><div class="av" style="background:#2f9e8f" aria-hidden="true">T</div><div class="mb"><div class="mh"><b>Tunde</b><time data-ago="4"></time></div><p>Almost. Final checks now.</p></div></div>
      <div class="msg"><div class="av" style="background:#e8a23a" aria-hidden="true">K</div><div class="mb"><div class="mh"><b>Kemi</b><time data-ago="2"></time></div><p>Ping me when it ships 🚀</p></div></div>
    </div>

    <div class="cw">
      <p class="hint" id="hint">Try sending a message ✈&#xFE0E;</p>
      <div class="comp">
        <div class="tb" role="toolbar" aria-label="Formatting">
          <button class="ic" aria-label="Bold"><svg class="i"><use href="#bold"/></svg></button>
          <button class="ic" aria-label="Italic"><svg class="i"><use href="#ital"/></svg></button>
          <button class="ic" aria-label="Strikethrough"><svg class="i"><use href="#strike"/></svg></button>
          <button class="ic" aria-label="Link"><svg class="i"><use href="#link"/></svg></button>
          <button class="ic" aria-label="Numbered list"><svg class="i"><use href="#ol"/></svg></button>
          <button class="ic" aria-label="Bulleted list"><svg class="i"><use href="#ul"/></svg></button>
          <button class="ic" aria-label="Code"><svg class="i"><use href="#code"/></svg></button>
          <button class="ic" aria-label="Code block"><svg class="i"><use href="#cb"/></svg></button>

          <button class="send" id="send" aria-label="Send message" aria-disabled="false"><svg class="i"><use href="#send-ic"/></svg></button>
        </div>
      </div>
    </div>
  </main>
</div>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>

<script>
(()=>{
const $=s=>document.querySelector(s),inp=$('#in'),btn=$('#send'),th=$('#th'),live=$('#live'),hint=$('#hint'),RM=matchMedia('(prefers-reduced-motion:reduce)');
const R=(a,b)=>a+Math.random()*(b-a),ss=x=>(x=Math.min(1,Math.max(0,x)))*x*(3-2*x),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const tm=m=>new Date(Date.now()-m*6e4).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
document.querySelectorAll('time[data-ago]').forEach(e=>e.textContent=tm(+e.dataset.ago));

const PL='<svg viewBox="0 0 32 24"><path d="M31 12 3 2l8 10z" fill="#8b7dff"/><path d="M31 12H11L3 22z" fill="#5b4bd6"/><path d="M11 12l2 5.5L3 22z" fill="#3a2f95"/></svg>';
let busy=false,q=[];

const mk=c=>{const d=document.createElement('div');d.className=c;d.setAttribute('aria-hidden','true');document.body.append(d);return d};
const ctr=e=>{const r=e.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}};
const bez=(S,C,E,e)=>{const u=1-e;return{x:u*u*S.x+2*u*e*C.x+e*e*E.x,y:u*u*S.y+2*u*e*C.y+e*e*E.y,tx:2*u*(C.x-S.x)+2*e*(E.x-C.x),ty:2*u*(C.y-S.y)+2*e*(E.y-C.y)}};
const ctrl=(S,E,k)=>{const dx=E.x-S.x,dy=E.y-S.y,L=Math.hypot(dx,dy)||1;return{x:(S.x+E.x)/2-dy/L*k*L,y:(S.y+E.y)/2+dx/L*k*L,L}};

/* outgoing: send arrow -> off the top right, on a curve with a slight bank */
function out(S){
  const E={x:innerWidth+70,y:-70},C=ctrl(S,E,(Math.random()<.7?-1:1)*R(.12,.3)),bank=R(5,11)*(Math.random()<.5?-1:1),N=20,fr=[];
  for(let i=0;i<=N;i++){
    const t=i/N,p=bez(S,C,E,Math.pow(t,1.45)),a=Math.atan2(p.ty,p.tx)+bank*Math.sin(Math.PI*t)*Math.PI/180,s=.7+.4*Math.min(1,t*5)-.25*t;
    fr.push({transform:`translate(${p.x}px,${p.y}px) rotate(${a}rad) scale(${s},${s*(1-.22*Math.sin(Math.PI*t))})`,opacity:Math.min(1,i/2)});
  }
  const f=mk('fly');f.innerHTML=PL;
  return{f,a:f.animate(fr,{duration:R(900,1150),delay:300,fill:'both'})};
}

/* return: tiny plane loops in from the top right and lands on the tick slot */
function back(T){
  const S={x:innerWidth+40,y:-30},C=ctrl(S,T,(Math.random()<.5?-1:1)*R(.12,.25)),r=Math.min(40,Math.max(26,C.L*.045)),N=48,P=[],d=1300;
  for(let i=0;i<=N;i++){
    const t=i/N,p=bez(S,C,T,1-Math.pow(1-t,2.4)),m=Math.hypot(p.tx,p.ty)||1,u=(t-.28)/.34;
    let x=p.x,y=p.y;
    if(u>0&&u<1){
      const th=2*Math.PI*u,dx=p.tx/m,dy=p.ty/m;let nx=-dy,ny=dx;if(ny>0){nx=-nx;ny=-ny}
      x+=dx*r*Math.sin(th)+nx*r*(1-Math.cos(th));y+=dy*r*Math.sin(th)+ny*r*(1-Math.cos(th));
    }
    P.push({x,y,t});
  }
  let pv=0;
  const A=P.map((p,i)=>{const j=Math.min(i,N-1);let a=Math.atan2(P[j+1].y-P[j].y,P[j+1].x-P[j].x);while(a-pv>Math.PI)a-=2*Math.PI;while(a-pv<-Math.PI)a+=2*Math.PI;return pv=a});
  const g=2*Math.PI*Math.round(A[N]/(2*Math.PI))-.2;
  const fr=P.map((p,i)=>{const w=ss((p.t-.8)/.2),a=A[i]*(1-w)+g*w,s=.3+.12*Math.min(1,p.t*4);
    return{transform:`translate(${p.x}px,${p.y}px) rotate(${a}rad) scale(${s})`,opacity:p.t<.06?p.t/.06:p.t>.88?(1-p.t)/.12:1}});
  const f=mk('fly');f.innerHTML=PL;
  return{f,d,a:f.animate(fr,{duration:d,fill:'both'})};
}

function add(t){
  const e=document.createElement('div');e.className='msg';
  e.innerHTML='<div class="av" style="background:#4b3fae" aria-hidden="true">Y</div><div class="mb"><div class="mh"><b>You</b><time>'+tm(0)+'</time><span class="tk"><span class="ck">✓✓</span></span></div><p></p></div>';
  e.querySelector('p').textContent=t;th.append(e);th.scrollTop=th.scrollHeight;
  e.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:260,easing:'ease-out'});
  return{ck:e.querySelector('.ck'),tk:e.querySelector('.tk')};
}

async function run(t){
  busy=true;
  const reduce=RM.matches;
  if(!reduce){
    const r=inp.getBoundingClientRect(),S=ctr(btn),c=mk('card');c.textContent=t;
    const w=c.offsetWidth,h=c.offsetHeight,x=r.left+14,y=r.top+r.height/2-h/2;
    c.animate([
      {transform:`translate(${x}px,${y}px)`,opacity:1},
      {transform:`translate(${x}px,${y-16}px) scale(1.04)`,opacity:1,offset:.4},
      {transform:`translate(${(x+S.x-w/2)/2}px,${(y+S.y-h/2)/2-10}px) scale(.8,.08)`,opacity:.9,offset:.75},
      {transform:`translate(${S.x-w/2}px,${S.y-h/2}px) scale(.4,.05)`,opacity:0}
    ],{duration:420,easing:'ease-in-out',fill:'forwards'}).onfinish=()=>c.remove();
    const o=out(S);
    try{await o.a.finished}catch(e){}
    o.f.remove();
  }
  const m=add(t);
  if(reduce){
    m.ck.animate({opacity:[0,1]},{duration:400,delay:250,fill:'forwards'});
    await sleep(700);
  }else{
    await sleep(500);
    const g=back(ctr(m.tk));
    m.ck.animate([{opacity:0,transform:'scale(.5)'},{opacity:1,transform:'scale(1)'}],{duration:300,delay:g.d*.88,fill:'forwards',easing:'cubic-bezier(.2,1.5,.4,1)'});
    try{await g.a.finished}catch(e){}
    g.f.remove();
  }
  live.textContent='';setTimeout(()=>live.textContent='Sent. Delivered.',60);
  busy=false;
  if(q.length)run(q.shift());
}

const sync=()=>btn.setAttribute('aria-disabled',String(!inp.value.trim()));
function submit(){
  const t=inp.value.trim();if(!t)return;
  inp.value='';sync();hint.classList.add('gone');
  busy?q.push(t):run(t);
  inp.focus({preventScroll:true});
}
btn.addEventListener('click',submit);
inp.addEventListener('input',sync);
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();submit()}});
th.scrollTop=th.scrollHeight;
})();
</script>
